<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下载管理</title><link rel="icon" href="data:,"><style>body{font:14px system-ui;margin:24px;color:#1f1f1f;background:white}main{max-width:960px;margin:auto}h1{font-size:24px}.row{padding:16px 0;border-bottom:1px solid #ddd}.path{overflow-wrap:anywhere}.muted{color:#606770;margin:8px 0}button{font:inherit;padding:6px 12px;border:1px solid #ccc;background:#fff;border-radius:4px;white-space:nowrap;cursor:pointer;margin:4px 8px 0 0}progress{width:100%;height:6px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}</style><main><header><h1>下载管理</h1><button id="clear">清除结束记录</button><a href="settings.html">下载设置</a></header><p id="notice" role="status"></p><div id="rows"></div></main><script>
const wv=window.chrome?.webview,rows=document.querySelector('#rows');
function send(type,id){wv?.postMessage(JSON.stringify({type:'downloads.'+type,id}))}
document.querySelector('#clear').onclick=()=>{if(confirm('只清除已结束的下载记录，不删除文件。继续？'))send('clear')};
function size(n){return n<0?'未知':n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function render(data){rows.replaceChildren();if(!data.length){rows.textContent='暂无下载记录';return}for(const d of data){const row=document.createElement('section');row.className='row';const name=document.createElement('div');name.className='path';name.textContent=d.path;row.append(name);const info=document.createElement('div');info.className='muted';info.textContent=(d.stateError?'状态暂不可读':d.state===2?'已完成':d.paused?'已暂停':d.state===1?'已中断':'下载中')+' · '+size(d.received)+' / '+size(d.total)+(d.speed?' · '+size(Math.round(d.speed))+'/s':'');row.append(info);if(d.state===0){const progress=document.createElement('progress');if(d.total>0){progress.max=d.total;progress.value=d.received}row.append(progress)}const actions=d.state===2?['open','folder']:(d.state===0||d.paused||d.canResume)&&d.live?[(d.paused||d.state===1)?'resume':'pause','cancel','folder']:d.url?['retry','folder']:['folder'];const names={open:'打开文件',folder:'所在文件夹',pause:'暂停',resume:'继续',cancel:'取消',retry:'重试'};for(const a of actions){const b=document.createElement('button');b.textContent=names[a];b.onclick=()=>send(a,d.id);row.append(b)}rows.append(row)}}
wv?.addEventListener('message',e=>{if(e.data.type==='utility.status')document.querySelector('#notice').textContent=e.data.error;if(e.data.type==='downloads.rows')render(e.data.rows)});send('get');setInterval(()=>{if(!document.hidden)send('get')},1000);
</script></html>

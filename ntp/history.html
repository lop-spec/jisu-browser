<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="icon" href="data:,"><title>历史记录</title><style>
:root{font:14px/1.6 'Segoe UI','Microsoft YaHei UI',sans-serif;color:#202124;background:#fff;--line:#e4e6e9;--muted:#70757a;--hover:#f3f5f7;--accent:#1769d3}@media(prefers-color-scheme:dark){:root{color:#e6e8eb;background:#202124;--line:#3b3f44;--muted:#a4a9b0;--hover:#2b3035;--accent:#8ab4f8}}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:inherit;flex-wrap:wrap}h1{font-size:19px;margin:0}input,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:6px;background:transparent;padding:6px 10px}input{flex:1;min-width:130px;max-width:600px}button{cursor:pointer}button:hover{background:var(--hover)}button:focus-visible,a:focus-visible,input:focus{outline:2px solid var(--accent);outline-offset:2px}main{max-width:1100px;margin:auto;padding:16px 24px}.muted{color:var(--muted)}.day{margin:20px 0 10px;font-weight:600}.row{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:10px 0;min-width:0}.time{color:var(--muted);font-size:12px;flex:none}.link{flex:1;min-width:0}.link a{color:inherit;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.link a:hover{color:var(--accent)}.url{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#more{display:block;margin:24px auto}#status{min-height:24px}@media(max-width:500px){header,main{padding:12px}header input{order:3;flex-basis:100%;max-width:none}.row{gap:8px}}
</style><header><h1>历史记录</h1><input id="query" type="search" aria-label="搜索历史" placeholder="搜索标题或网址" maxlength="200" autocomplete="off"><button id="clear">清空历史</button></header><main><p class="muted">保留最近 90 天，最多 20,000 条。智能体后台浏览不记入。</p><p id="status" class="muted" role="status">加载中…</p><div id="list"></div><button id="more" hidden>更多记录</button></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),bridge=window.chrome?.webview;let query='',offset=0,timer,waiting=false;const send=(type,extra={})=>{waiting=true;bridge?.postMessage(JSON.stringify({type,query,offset,...extra}));};function reload(){offset=0;$('#list').replaceChildren();send('history.get');}function el(tag,text,cls){const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x;}bridge?.addEventListener('message',({data:d})=>{if(d.type!=='history.rows'||d.query!==query.toLowerCase())return;waiting=false;if(d.loading){$('#status').textContent='正在更新…';clearTimeout(timer);timer=setTimeout(()=>send('history.get'),300);return;}if(offset===0)$('#list').replaceChildren();let day='';for(const item of d.rows){const date=new Date(item.at),key=date.toLocaleDateString();if(key!==day){$('#list').append(el('div',key,'day'));day=key;}const row=el('div','','row');row.dataset.id=item.id;row.append(el('time',date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),'time'));const link=el('div','','link'),a=el('a',item.title||item.url);a.href=item.url;a.title=item.url;a.onclick=e=>{e.preventDefault();bridge.postMessage(JSON.stringify({type:'open',url:item.url,newTab:true}));};link.append(a,el('div',item.url,'url'));const remove=el('button','删除');remove.setAttribute('aria-label','删除 '+(item.title||item.url));remove.onclick=()=>{offset=0;send('history.remove',{id:item.id});};row.append(link,remove);$('#list').append(row);}$('#status').textContent=d.error||(d.total?'共 '+d.total+' 条':'没有记录');$('#more').hidden=offset+d.rows.length>=d.total;});$('#query').oninput=()=>{clearTimeout(timer);query=$('#query').value.trim();timer=setTimeout(reload,180);};$('#clear').onclick=()=>{if(confirm('清空极速浏览器的全部浏览历史？此操作不能撤销。')){offset=0;send('history.clear');}};$('#more').onclick=()=>{if(!waiting){offset+=100;send('history.get');}};if(bridge)reload();else $('#status').textContent='请在极速浏览器中打开';})();
</script></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><link rel="icon" href="data:,"><title>极速播放器</title><style>
:root{font:13px/1.5 'Segoe UI','Microsoft YaHei UI',sans-serif;color:#e6e8ee;background:#16181c;--line:#383d45;--muted:#9ba3af;--accent:#8ab4f8}*{box-sizing:border-box}body{margin:0;padding:9px 14px}button,input,select{color:inherit;background:#22262c;border:1px solid var(--line);border-radius:5px;font:inherit;padding:4px 8px;min-height:28px}button,select{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}input[type=range]{accent-color:var(--accent);padding:0;min-width:40px}input[type=checkbox]{min-height:0}header,.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:7px}h1{font-size:14px;font-weight:600;margin:0;flex:1;min-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#progress{flex:1}#clock{font-variant-numeric:tabular-nums;font-size:12px;min-width:90px}.muted{color:var(--muted)}#status{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0}#error{color:#f7a5a5;margin:2px 0;font-size:12px}#url{flex:1;min-width:120px}#lines{max-width:230px}#extra{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0}label{display:inline-flex;gap:5px;align-items:center}label input[type=number]{width:70px}.track{max-width:180px}summary{cursor:pointer;color:var(--muted)}details{font-size:12px}details[open]{padding-bottom:10px}#diagnostics{white-space:pre-wrap;font-size:12px;overflow-wrap:anywhere;margin:4px 0}#empty{padding:40px 20px;max-width:650px;margin:auto}#empty h2{font-size:21px;font-weight:500}#empty p{color:var(--muted)}body.active #empty{display:none}body:not(.active) #controls{display:none}@media(max-width:500px){body{padding:8px}button,input,select{padding:4px 6px}#volume{width:70px}#lines{max-width:170px}.track{max-width:130px}}
</style><section id="empty"><h2>极速播放器</h2><p>打开本地视频或 HTTP(S) 媒体直链。网页视频可用菜单「极速播放器」或 Ctrl+Shift+M 交接；受保护视频继续使用原网页。</p></section><header><h1 id="title">极速播放器</h1><button data-op="file">打开文件</button><input id="url" aria-label="媒体地址" placeholder="粘贴媒体直链"><button id="open">打开链接</button></header><p id="error" role="alert"></p><section id="controls"><div class="row"><button id="pause" data-op="pause" aria-label="播放或暂停">暂停</button><input id="progress" type="range" aria-label="播放进度" min="0" max="100" step="0.1" value="0"><span id="clock">0:00 / 0:00</span></div><div class="row"><button data-op="prev" title="上一集">上一集</button><button data-op="next" title="下一集">下一集</button><select id="lines" aria-label="播放线路" hidden></select><select data-property="speed" aria-label="播放速度"><option value="0.5">0.5 倍</option><option value="0.75">0.75 倍</option><option value="1" selected>1 倍</option><option value="1.25">1.25 倍</option><option value="1.5">1.5 倍</option><option value="2">2 倍</option><option value="3">3 倍</option><option value="4">4 倍</option></select><input id="volume" type="range" aria-label="音量" min="0" max="100" value="100" style="width:90px"><button data-op="pip">小窗置顶</button><button data-op="fullscreen">全屏</button></div><p id="status" class="muted" role="status">正在启动媒体进程…</p><details><summary>音轨、字幕与画质</summary><div id="extra"><label>音轨<select id="audio" class="track" data-property="aid" aria-label="音轨"></select></label><label>字幕<select id="sub" class="track" data-property="sid" aria-label="字幕"></select></label><label>双字幕<select id="secondary" class="track" data-property="secondary-sid" aria-label="第二字幕"></select></label><button data-op="subtitle">外挂字幕</button><label>章节<select id="chapter" class="track" data-property="chapter" aria-label="章节"></select></label><label>字幕延迟<input type="number" value="0" step="0.1" min="-600" max="600" data-property="sub-delay" aria-label="字幕延迟秒"></label><label>音频延迟<input type="number" value="0" step="0.1" min="-600" max="600" data-property="audio-delay" aria-label="音频延迟秒"></label><label>解码<select data-property="hwdec" aria-label="解码方式"><option value="auto-safe">智能硬解</option><option value="no">软件解码</option></select></label><label>画面<select data-property="video-aspect-override" aria-label="画面比例"><option value="-1">原始比例</option><option value="1.777778">16:9</option><option value="1.333333">4:3</option><option value="1">1:1</option></select></label><label>超分<select id="enhance" aria-label="超分辨率"><option value="off">关闭</option><option value="anime4k">Anime4K</option></select></label><label><input id="deinterlace" type="checkbox">去隔行</label><button data-op="frame-back" title="暂停并退一帧">上一帧</button><button data-op="frame" title="暂停并进一帧">下一帧</button><button data-op="screenshot">截图</button><button data-op="close">释放播放器</button></div><p class="muted">截图保存到系统「图片」。超分会增加 GPU 和显存占用，默认关闭。无全站扫描、不复制网站 Cookie；无法交接的流保留网页播放。</p><pre id="diagnostics"></pre></details></section><script>
(()=>{'use strict';const $=s=>document.querySelector(s),bridge=window.chrome?.webview;let latest={},tracks='',chapters='',seeking=false;const send=(op,more={})=>bridge?.postMessage(JSON.stringify({type:'player.'+op,...more}));const clock=t=>{t=Math.max(0,Math.floor(t||0));return(t>=3600?Math.floor(t/3600)+':':'')+Math.floor(t/60%60)+':'+String(t%60).padStart(2,'0');};document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{if(b.dataset.op==='file')document.body.classList.add('active');send(b.dataset.op);});document.querySelectorAll('[data-property]').forEach(e=>e.onchange=()=>send('set',{key:e.dataset.property,value:e.value}));$('#open').onclick=()=>{try{const u=new URL($('#url').value.trim());if(!/^https?:$/.test(u.protocol)||u.username||u.password)throw Error();document.body.classList.add('active');$('#error').textContent='';send('open',{url:u.href});}catch{$('#error').textContent='请输入有效的 HTTP(S) 媒体直链';}};$('#url').onkeydown=e=>{if(e.key==='Enter')$('#open').click();};$('#progress').oninput=()=>{seeking=true;$('#clock').textContent=clock(+$('#progress').value)+' / '+clock(latest.duration);};$('#progress').onchange=()=>{send('seek',{value:+$('#progress').value,absolute:true});seeking=false;};$('#volume').onchange=()=>send('set',{key:'volume',value:$('#volume').value});$('#enhance').onchange=()=>send('enhance',{value:$('#enhance').value});$('#deinterlace').onchange=()=>send('set',{key:'deinterlace',value:$('#deinterlace').checked?'yes':'no'});$('#lines').onchange=()=>send('line',{index:+$('#lines').value});function option(value,title){const o=document.createElement('option');o.value=value;o.textContent=title;return o;}bridge?.addEventListener('message',({data:d})=>{if(d.type==='player.closed'){document.body.classList.remove('active');$('#title').textContent='极速播放器';$('#error').textContent='';return;}if(d.type==='player.enhancement-reduced'){$('#error').textContent='检测到持续丢帧，已自动关闭超分';return;}if(d.type==='player.error'){$('#error').textContent=d.error;return;}if(d.type==='player.screenshot'){$('#error').textContent='截图已保存到系统「图片」';return;}if(d.type==='player.offer'){const m=d.data;$('#title').textContent=m.title||'极速播放器';document.body.classList.add('active');const ls=$('#lines');ls.replaceChildren(...(m.lines||[]).map(l=>option(l.index,(l.tier?l.tier+'P · ':'')+(l.name||'线路')+(l.codec?' · '+l.codec:''))));ls.hidden=!ls.children.length;if(m.index!==undefined)ls.value=m.index;document.querySelectorAll('[data-op=next],[data-op=prev]').forEach(e=>e.hidden=m.integration!=='qingfan');return;}if(d.type==='player.loaded')$('#error').textContent='';if(d.type!=='player.status')return;latest=d;document.body.classList.add('active');if(document.activeElement!==$('#enhance'))$('#enhance').value=d.enhanced?'anime4k':'off';const ch=d['chapter-list']||[],chKey=JSON.stringify(ch);if(chKey!==chapters){chapters=chKey;$('#chapter').replaceChildren(...ch.map((c,i)=>option(i,c.title||'第 '+(i+1)+' 章')));}if(document.activeElement!==$('#chapter'))$('#chapter').value=String(d.chapter??-1);if(d.title)$('#title').textContent=d.title;$('#pause').textContent=d.pause?'播放':'暂停';if(!seeking){$('#progress').max=d.duration||100;$('#progress').value=d['time-pos']||0;$('#clock').textContent=clock(d['time-pos'])+' / '+clock(d.duration);}const v=d['video-params']||{},hw=d['hwdec-current'];$('#status').textContent=[d['video-codec'],v.w&&v.h?v.w+' × '+v.h:'',hw&&hw!=='no'?'硬解 '+hw:'软件解码','缓冲 '+Number(d['demuxer-cache-duration']||0).toFixed(1)+' 秒','丢帧 '+(d['frame-drop-count']||0)].filter(Boolean).join(' · ');$('#diagnostics').textContent='音频：'+(d['audio-codec-name']||'—')+'\n色彩：'+(v.primaries||'—')+' / '+(v.gamma||'—')+'\n解码丢帧：'+(d['decoder-frame-drop-count']||0);const list=d['track-list']||[],signature=JSON.stringify(list.map(t=>[t.id,t.type,t.title,t.lang]));if(tracks!==signature){tracks=signature;for(const [sel,type,off] of [['#audio','audio','自动'],['#sub','sub','关闭'],['#secondary','sub','关闭']])$(sel).replaceChildren(option(sel==='#audio'?'auto':'no',off),...list.filter(t=>t.type===type).map(t=>option(t.id,t.title||[t.lang,t.codec].filter(Boolean).join(' · ')||String(t.id))));}for(const [sel,key] of [['#audio','aid'],['#sub','sid'],['#secondary','secondary-sid']])if(document.activeElement!==$(sel))$(sel).value=d[key]===false?'no':String(d[key]||'no');});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();send('pause');}if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();send('seek',{value:e.code==='ArrowRight'?10:-10});}if(e.code==='KeyF'){e.preventDefault();send('fullscreen');}});send('get');})();
</script></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{font:14px system-ui;margin:24px;color:#1f1f1f;background:white}main{max-width:720px;margin:auto}h1{font-size:24px}h2{font-size:18px;margin-top:28px}label{display:block;margin:16px 0}input[type=text],select,input[type=number]{display:block;width:100%;margin-top:8px;padding:8px;border:1px solid #bbb;border-radius:4px;font:inherit}button{font:inherit;padding:8px 14px;border:1px solid #bbb;border-radius:4px;background:white;cursor:pointer;white-space:nowrap}p{color:#606770;line-height:1.6}.primary{color:white;background:#2167d5;border-color:#2167d5}</style><main><h1>设置</h1><form id="form"><label>搜索引擎<select id="searchEngine"><option value="bing">Bing</option><option value="google">Google</option><option value="baidu">百度</option></select></label><label><input type="checkbox" id="continueSession"> 启动时继续上次浏览</label><label>普通标签上限<input id="maxRegularTabs" type="number" min="1" max="99" value="10"></label><p>启用自动关旧标签扩展时生效；按最近使用时间关闭，固定、智能体、正在下载的标签受保护。</p><h2>下载</h2><label>保存位置<input type="text" id="downloadDirectory" maxlength="1000"></label><label><input type="checkbox" id="askDownload"> 每次询问保存位置</label><button class="primary" type="submit">保存设置</button> <span id="status" role="status"></span></form><h2>隐私</h2><p id="popupCount"></p><button id="popups">撤销弹窗允许</button><p>清除缓存和历史不会退出账号；包含 Cookie 的清除会退出网站登录，也会清除内核保存的资料。</p><button id="clear">清除缓存历史</button> <button id="all">清除全部资料</button></main><script>
const wv=window.chrome?.webview,$=id=>document.getElementById(id);function send(type,data={}){wv?.postMessage(JSON.stringify({type:'settings.'+type,...data}))}let saving=false;
wv?.addEventListener('message',e=>{const d=e.data;if(d.type!=='settings.data')return;for(const k of ['searchEngine','maxRegularTabs','downloadDirectory'])$(k).value=d[k];for(const k of ['askDownload','continueSession'])$(k).checked=d[k];$('popupCount').textContent='已允许 '+d.popupCount+' 个站点弹出窗口';if(saving){$('status').textContent='保存请求已提交';saving=false}});
$('form').onsubmit=e=>{e.preventDefault();saving=true;const data={};for(const k of ['searchEngine','maxRegularTabs','downloadDirectory'])data[k]=$(k).value;data.maxRegularTabs=Number(data.maxRegularTabs);for(const k of ['askDownload','continueSession'])data[k]=$(k).checked;send('save',data)};
$('popups').onclick=()=>send('popups.clear');$('clear').onclick=()=>{if(confirm('清除缓存和浏览历史？'))send('clear')};$('all').onclick=()=>{if(confirm('清除全部内核浏览资料？网站将退出登录，此操作不能撤销。'))send('clear',{cookies:true})};send('get');
</script></html>
